[book]
title = "Cloud in a Bottle Manual"
authors = ["Imbue"]
description = "Documentation for the Cloud in a Bottle platform, for owners and app authors."
src = "src"
language = "en"

[output.html]
git-repository-url = "https://github.com/cloud-in-a-bottle/cloud-in-a-bottle"
