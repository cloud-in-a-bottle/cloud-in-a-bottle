name: release

# The one true Cloud in a Bottle release process. Pushing a version tag (vMAJOR.MINOR.PATCH)
# does everything: it verifies the tree's pyproject version matches the tag and
# that no external pin has drifted, builds the VM image artifacts, and publishes
# a GitHub release whose notes are the auto-generated "What's Changed" changelog
# with the VM-image usage notes on top.
#
# To cut a release (the version lives in the root pyproject.toml; that distribution
# bundles the sub-packages, so that one field is the version of record; the package
# itself is still named `openhost`, only the release artifacts are rebranded):
#   uv version 0.1.4                   # or edit pyproject.toml's [project] version
#   git commit -am "Release v0.1.4" && git push
#   git tag v0.1.4 && git push origin v0.1.4
#
# The release is created as a draft so a human can review the changelog before it
# goes public. The same vX.Y.Z tags drive the host auto-updater
# (openhost_system_agent/update.py), so there is exactly one tag scheme.
#
# Images are built for amd64 (on the runner, with KVM) and arm64 (on an EC2
# Graviton bare-metal host, via image/on_ec2.sh). Pull requests that touch the
# image build, and manual runs on a branch, build without publishing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  # Fast gate: refuse to build if the root pyproject version doesn't match the tag.
  # This is what turns "we forgot to bump pyproject" into a loud, immediate failure.
  verify-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pyproject version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$got" != "$want" ]; then
            echo "::error::pyproject.toml is at '$got' but the tag is '$TAG'."
            echo "Bump the [project] version in pyproject.toml to $want, commit, then re-tag."
            exit 1
          fi
          echo "version ok: pyproject.toml $got matches $TAG"

  # Blocking gate: a release ships the pins, so a pin that has fallen behind
  # upstream must be reviewed and bumped (or deliberately re-pinned as-is)
  # before we cut one.  --strict turns drift into a failure here; the same
  # check runs advisory-only on main (see ci.yml).
  pin-drift:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Fail on stale external pins
        run: pixi run -e dev python scripts/check_pin_drift.py --strict

  build:
    needs: [verify-version, pin-drift]
    # Run on workflow_dispatch too, where the tag-only gates are skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    # The build boots a VM and provisions it end to end; give it plenty of room.
    # build.sh has its own 30-min boot timeout inside this budget.
    timeout-minutes: 90
    env:
      # The ref provision.sh clones: the tag, or the PR / dispatched branch.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image build dependencies
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils

      - name: Enable KVM access
        if: matrix.arch == 'amd64'
        run: |
          # GitHub's 2-vCPU+ Linux runners (incl. ubuntu-latest) ship /dev/kvm,
          # but it's root:kvm 0660, not writable by the runner user, which
          # build.sh requires. Grant access via udev. Same rule
          # android-emulator-runner uses. See
          # https://github.com/actions/runner-images/issues/7541.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build VM images
        if: matrix.arch == 'amd64'
        run: image/build.sh --branch "$BRANCH" --version "${BRANCH//\//-}"

      # GitHub's arm64 runners have no /dev/kvm, so build arm64 on an EC2
      # Graviton bare-metal host, which does.
      - name: Build VM images on EC2
        if: matrix.arch == 'arm64'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EC2_KEY_NAME: ${{ secrets.EC2_KEY_NAME }}
          EC2_SECURITY_GROUP: ${{ secrets.EC2_SECURITY_GROUP }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_E2E_SSH_PRIVATE_KEY }}
        run: |
          export EC2_SSH_KEY="$RUNNER_TEMP/ec2_key"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$EC2_SSH_KEY"
          chmod 600 "$EC2_SSH_KEY"
          image/on_ec2.sh "image/build.sh --cpus 8 --mem 16384 --branch '$BRANCH' --version '${BRANCH//\//-}'"

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-log-${{ matrix.arch }}
          path: image/out/build-console.log
          if-no-files-found: ignore

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: |
            image/out/*.qcow2
            image/out/*.ova
          if-no-files-found: error
          # Already compressed; re-zipping only burns time.
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: image/out
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(image/out/cloud-in-a-bottle-*.qcow2)
          for ova in image/out/cloud-in-a-bottle-*.ova; do
            [ -e "$ova" ] && assets+=("$ova")
          done

          # The VM-image usage notes ride on top of GitHub's auto-generated
          # "What's Changed" changelog. gh can't emit both at once, so create with
          # --generate-notes, then prepend our blurb to whatever it produced.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cloud in a Bottle $TAG" \
            --generate-notes \
            --draft \
            "${assets[@]}"

          changelog="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          preamble="Cloud in a Bottle $TAG. VM images below.

          - \`*-amd64.qcow2\`: QEMU/KVM/libvirt (and most cloud importers)
          - \`*-amd64.ova\`: VirtualBox / VMware
          - \`*-arm64.qcow2\`: arm64 hosts (UTM on Apple silicon, QEMU/KVM on arm64 Linux); boots via UEFI

          Boot it, then reach the dashboard at \`http://<vm-ip>:8080\` and claim it
          (claiming is open by default — the image is private behind NAT).
          See \`image/build.sh\` for defaults (console login, disk sizing).

          ---
          "
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "${preamble}
          ${changelog}"
