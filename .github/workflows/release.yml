name: release

# The one true OpenHost release process. Pushing a version tag (vMAJOR.MINOR.PATCH)
# does everything: it verifies the tree's pyproject version matches the tag, builds
# the VM image artifacts, and publishes a GitHub release whose notes are the
# auto-generated "What's Changed" changelog with the VM-image usage notes on top.
#
# To cut a release (the version lives in the root pyproject.toml — the openhost
# distribution bundles the sub-packages, so that one field is the version of record):
#   uv version 0.1.4                   # or edit pyproject.toml's [project] version
#   git commit -am "Release v0.1.4" && git push
#   git tag v0.1.4 && git push origin v0.1.4
#
# The release is created as a draft so a human can review the changelog before it
# goes public. The same vX.Y.Z tags drive the host auto-updater
# (openhost_system_agent/update.py), so there is exactly one tag scheme.
#
# Images are built for amd64 and arm64, each on a runner of its own arch, and
# each is smoke tested (booted, claimed, default apps deployed) before anything
# is published. Pull requests that touch the image build, and manual runs on a
# branch, do the build and smoke test only. Pull requests skip arm64, which
# takes hours under emulation; build it locally (image/build.sh runs natively
# on Apple silicon) or with a manual run.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  # Fast gate: refuse to build if the root pyproject version doesn't match the tag.
  # This is what turns "we forgot to bump pyproject" into a loud, immediate failure.
  verify-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pyproject version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          if [ "$got" != "$want" ]; then
            echo "::error::pyproject.toml is at '$got' but the tag is '$TAG'."
            echo "Bump the [project] version in pyproject.toml to $want, commit, then re-tag."
            exit 1
          fi
          echo "version ok: pyproject.toml $got matches $TAG"

  build:
    needs: verify-version
    # Run on workflow_dispatch too, where verify-version is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # The build boots a VM and provisions it end to end, then the smoke test
    # boots it again and deploys the default apps; give it plenty of room.
    # build.sh and smoke_test.sh have their own deadlines inside this budget.
    # GitHub's arm64 runners have no /dev/kvm, so arm64 boots under TCG
    # emulation: slow, so give the VM every core and a long deadline.
    timeout-minutes: ${{ matrix.arch == 'arm64' && 350 || 120 }}
    env:
      KVM: ${{ matrix.arch == 'amd64' }}
      QEMU_PACKAGES: ${{ matrix.arch == 'arm64' && 'qemu-system-arm qemu-efi-aarch64' || 'qemu-system-x86' }}
      VM_ARGS: ${{ matrix.arch == 'arm64' && '--cpus 4 --mem 8192 --timeout 12600' || '' }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $QEMU_PACKAGES qemu-utils cloud-image-utils

      - name: Enable KVM access
        if: env.KVM == 'true'
        run: |
          # GitHub's 2-vCPU+ Linux runners (incl. ubuntu-latest) ship /dev/kvm,
          # but it's root:kvm 0660 — not writable by the runner user. Grant
          # access via udev so build.sh uses hardware acceleration instead of
          # the (much slower) TCG fallback. Same rule android-emulator-runner
          # uses. See https://github.com/actions/runner-images/issues/7541.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Require KVM
        if: env.KVM == 'true'
        run: |
          ls -l /dev/kvm || true
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not usable. The build needs KVM; a TCG"
            echo "fallback would exceed the boot timeout, so failing fast. If this"
            echo "persists, the runner may lack nested virtualization — use a"
            echo "larger runner or a self-hosted KVM runner."
            exit 1
          fi
          echo "KVM available — build will use hardware acceleration."

      - name: Build VM images
        env:
          # The ref provision.sh clones: the tag, or the PR / dispatched branch.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          image/build.sh --arch ${{ matrix.arch }} $VM_ARGS \
            --branch "$BRANCH" --version "${BRANCH//\//-}"

      - name: List built artifacts
        run: ls -lh image/out/

      - name: Smoke test the image
        run: |
          image/smoke_test.sh --arch ${{ matrix.arch }} $VM_ARGS \
            image/out/openhost-*-${{ matrix.arch }}.qcow2

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-logs-${{ matrix.arch }}
          path: image/out/*.log
          if-no-files-found: ignore

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: |
            image/out/*.qcow2
            image/out/*.ova
          if-no-files-found: error
          # Already compressed; re-zipping only burns time.
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: image/out
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(image/out/openhost-*.qcow2)
          for ova in image/out/openhost-*.ova; do
            [ -e "$ova" ] && assets+=("$ova")
          done

          # The VM-image usage notes ride on top of GitHub's auto-generated
          # "What's Changed" changelog. gh can't emit both at once, so create with
          # --generate-notes, then prepend our blurb to whatever it produced.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenHost $TAG" \
            --generate-notes \
            --draft \
            "${assets[@]}"

          changelog="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          preamble="OpenHost $TAG — VM images below.

          - \`*-amd64.qcow2\`: QEMU/KVM/libvirt (and most cloud importers)
          - \`*-amd64.ova\`: VirtualBox / VMware
          - \`*-arm64.qcow2\`: arm64 hosts (UTM on Apple silicon, QEMU/KVM on arm64 Linux); boots via UEFI

          Boot it, then reach the dashboard at \`http://<vm-ip>:8080\` and claim it
          (claiming is open by default — the image is private behind NAT).
          See \`image/build.sh\` for defaults (console login, disk sizing).

          ---
          "
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "${preamble}
          ${changelog}"
