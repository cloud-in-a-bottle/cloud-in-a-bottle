name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          environments: dev
      - run: pixi run -e dev pre-commit run -a

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          environments: dev
      - run: pixi run -e dev pytest -v

  # Advisory only: reports when a pin in tests/external_pins.toml has fallen
  # behind what it tracks.  Deliberately does not gate the merge: a stale pin is
  # something to review and bump, not a reason to block an unrelated change.
  pin-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Report stale external pins
        run: |
          {
            echo "### External pin drift"
            echo '```'
            pixi run -e dev python scripts/check_pin_drift.py | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Install Chromium
        run: pixi run -e dev playwright install --with-deps chromium
      - name: Run automated WCAG 2.2 AA checks
        run: pixi run -e dev pytest tests/test_accessibility.py tests/test_app_definition_export_browser.py -v

  # Runs full unit test suite, including containerized tests.
  test-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Install rootless container support packages
        run: |
          sudo apt-get update
          sudo apt-get remove -y --purge podman crun
          sudo apt-get install -y uidmap passt
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify rootless podman works
        run: |
          pixi run -e dev podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
      # Pasta shares the host's IP with containers, so host-gateway can't reach
      # host services; mirror the prod setup from ansible/tasks/containers.yml —
      # a dummy interface that containers use to reach the router (start.py
      # auto-binds 10.200.0.1 when the interface exists).  Must come before any
      # tests that make app->router service calls.
      - name: Create openhost0 dummy interface for container-to-router traffic
        run: |
          sudo ip link add openhost0 type dummy
          sudo ip addr add 10.200.0.1/32 dev openhost0
          sudo ip link set openhost0 up
          mkdir -p ~/.config/containers
          printf '[containers]\nhost_containers_internal_ip = "10.200.0.1"\n' >> ~/.config/containers/containers.conf
      - name: Install playwright browsers
        run: pixi run -e dev playwright install --with-deps chromium
      - name: Run all tests, including containerized tests
        run: |
          pixi run -e dev pytest --run-containers -v
      - name: Run local full-stack service e2e tests
        run: |
          pixi run -e dev pytest --run-containers -v tests/test_services_e2e.py
      - name: Dump router and app logs on failure
        if: failure()
        run: |
          find /tmp -name router.log 2>/dev/null | while read -r f; do echo "=== $f ==="; tail -100 "$f"; done
          for c in $(pixi run -e dev podman ps -a --format '{{.Names}}'); do echo "=== podman logs $c ==="; pixi run -e dev podman logs --tail 50 "$c" 2>&1; done
