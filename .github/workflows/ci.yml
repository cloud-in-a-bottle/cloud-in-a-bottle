name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: ./.github/actions/setup-pixi
        if: github.event_name != 'schedule'
        with:
          pixi-version: v0.70.2
          environments: dev
      - run: pixi run -e dev pre-commit run -a
        if: github.event_name != 'schedule'
      - name: Initialize CodeQL
        id: codeql
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: github/codeql-action/init@v4
        with:
          languages: actions,javascript-typescript,python
          queries: security-extended
      - name: Analyze with CodeQL
        if: ${{ !cancelled() && steps.codeql.outcome == 'success' }}
        uses: github/codeql-action/analyze@v4

  # Unit suite plus the Chromium browser/accessibility tests, both spread over the
  # runner's cores with xdist.  --dist loadfile keeps each file on one worker so
  # module-scoped fixtures (a local router per browser file) start once.
  test:
    if: github.event_name != 'schedule'
    # Pinned: Playwright 1.60 can't install browsers on ubuntu-26.04 (now ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Run unit tests
        run: pixi run -e dev pytest -n auto --dist loadfile
      # No --with-deps: the runner image already ships every library Chromium
      # needs, and --with-deps only adds ~32 MB of extra fonts from the runner's
      # Ubuntu mirror, which regularly stalls at ~60 kB/s for 5 to 9 minutes.
      - name: Install Chromium
        run: pixi run -e dev playwright install chromium
      - name: Run browser and automated WCAG 2.2 AA tests
        run: >-
          pixi run -e dev pytest -n auto --dist loadfile
          tests/test_accessibility.py
          tests/test_app_definition_export_browser.py
          tests/test_app_definition_load_browser.py
          tests/test_setup_readiness.py
          tests/test_auto_update_schedule_browser.py

  # Advisory only: reports when a pin in tests/external_pins.toml has fallen
  # behind what it tracks.  Deliberately does not gate anything: a stale pin is
  # something to review and bump, not a reason to block an unrelated change.
  # Runs on main only, not per PR -- drift is a property of the repo over time,
  # not of a branch, so checking it once per landed commit is enough.  The
  # blocking version of this check runs when a release is cut; see
  # the pin-drift job in release.yml.
  pin-drift:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Report stale external pins
        run: |
          {
            echo "### External pin drift"
            echo '```'
            pixi run -e dev python scripts/check_pin_drift.py | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs only the tests that need rootless podman; everything else runs in the
  # test job above, so repeating it here would just double the wall time.
  test-containers:
    if: github.event_name != 'schedule'
    # Pinned: Playwright 1.60 can't install browsers on ubuntu-26.04 (now ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
        with:
          pixi-version: v0.70.2
          environments: dev
      - name: Install rootless container support packages
        run: |
          sudo apt-get update
          sudo apt-get remove -y --purge podman crun
          sudo apt-get install -y uidmap passt
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify rootless podman works
        run: |
          pixi run -e dev podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
      # Pasta shares the host's IP with containers, so host-gateway can't reach
      # host services; mirror the prod setup from ansible/tasks/containers.yml —
      # a dummy interface that containers use to reach the router (start.py
      # auto-binds 10.200.0.1 when the interface exists).  Must come before any
      # tests that make app->router service calls.
      - name: Create openhost0 dummy interface for container-to-router traffic
        run: |
          sudo ip link add openhost0 type dummy
          sudo ip addr add 10.200.0.1/32 dev openhost0
          sudo ip link set openhost0 up
          mkdir -p ~/.config/containers
          printf '[containers]\nhost_containers_internal_ip = "10.200.0.1"\n' >> ~/.config/containers/containers.conf
      # No --with-deps; see the test job.  One harness test drives a browser.
      - name: Install playwright browsers
        run: pixi run -e dev playwright install chromium
      # Every requires_containers test in the repo, including tests/ (outside
      # testpaths), hence the explicit ".".  Files run concurrently, so container
      # tests must not share podman names, images or ports across files; tests
      # within a file still run in order on one worker (--dist loadfile).
      - name: Run containerized tests
        run: |
          pixi run -e dev pytest --run-containers -m requires_containers -n 3 --dist loadfile -v .
      - name: Dump router and app logs on failure
        if: failure()
        run: |
          find /tmp -name router.log 2>/dev/null | while read -r f; do echo "=== $f ==="; tail -100 "$f"; done
          for c in $(pixi run -e dev podman ps -a --format '{{.Names}}'); do echo "=== podman logs $c ==="; pixi run -e dev podman logs --tail 50 "$c" 2>&1; done
