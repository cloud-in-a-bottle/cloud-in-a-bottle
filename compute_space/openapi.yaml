      required:
      - paused
      title: ToggleStorageGuardRequest
    VersionInfo:
      properties:
        branch:
          oneOf:
          - type: string
          - type: 'null'
        sha:
          type: string
        short_sha:
          type: string
        dirty:
          type: boolean
      type: object
      required:
      - branch
      - dirty
      - sha
      - short_sha
      title: VersionInfo
    ZoneIdentityResponse:
      properties:
        domain:
          type: string
        public_key_pem:
          type: string
        protocol:
          type: string
      type: object
      required:
      - domain
      - protocol
      - public_key_pem
      title: ZoneIdentityResponse
  securitySchemes:
    OwnerToken:
      type: http
      description: 'Owner API token, sent as `Authorization: Bearer <token>`.'
      scheme: bearer
    AppToken:
      type: http
      description: 'App token, injected by the router as `OPENHOST_APP_TOKEN` and
        sent as `Authorization: Bearer <token>`. Not an owner token — an owner token
        is rejected on these routes.'
