{% extends "_layout_narrow.html" %}
{% block title_suffix %} - Your app is coming up{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ static_url('css/app-starting.css') }}">
<script src="{{ static_url('js/app-starting.js') }}" defer></script>
{% endblock %}
{% block content %}
<main class="app-starting" data-retry-seconds="{{ retry_seconds }}">
  <div class="app-starting__indicator" aria-hidden="true"><span></span><span></span><span></span></div>
  <h2>Your app is coming up</h2>
  <p><strong>{{ app_name }}</strong> is getting ready.</p>
  <p class="hint" id="startup-hint" aria-live="polite">Give it a moment, then refresh this page to try again.</p>
</main>
{% endblock %}
