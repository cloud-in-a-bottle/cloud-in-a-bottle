{% extends "layout.html" %}
{% block title_suffix %} - Logs{% endblock %}
{% block layout_class %}layout--wide{% endblock %}
{% from "_components/section.html" import section_head %}
{% block content %}
<style>
  /* Full-height log viewer: the layout column becomes the flex parent so the
     <pre> takes the remaining space instead of the page scrolling. */
  html, body { height: 100%; overflow: hidden; }
  body { padding-bottom: 0; }
  .layout { display: flex; flex-direction: column; height: 100%; padding-bottom: var(--space-4); }
  .layout > * { flex: none; }
  #cs-logs { flex: 1 1 auto; min-height: 0; max-height: none; white-space: pre-wrap; word-break: break-all; }
</style>
{% call section_head("Compute Space Logs") %}{% endcall %}
<pre class="log-output" id="cs-logs">Loading...</pre>

<script>
(function() {
  var logEl = document.getElementById('cs-logs');

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 50;
  }

  function fetchLogs() {
    fetch('/api/compute_space_logs', {credentials: 'same-origin'})
      .then(function(r) { return r.text(); })
      .then(function(text) {
        var sel = window.getSelection();
        if (sel && !sel.isCollapsed && logEl.contains(sel.anchorNode)) return;
        var wasAtBottom = isNearBottom(logEl);
        logEl.textContent = text || 'No log output available.';
        if (wasAtBottom) logEl.scrollTop = logEl.scrollHeight;
      });
  }

  fetchLogs();
  setInterval(fetchLogs, 3000);
})();
</script>
{% endblock %}
