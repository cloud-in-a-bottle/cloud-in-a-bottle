{% extends "_layout_narrow.html" %}
{% from "_components/button.html" import button %}
{% block title_suffix %} - Login{% endblock %}

{% block content %}
<h2>Log in</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field">
    <span>Password</span>
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <div class="actions">
    {{ button("Log in", variant="primary", type="submit") }}
  </div>
</form>
{% endblock %}
