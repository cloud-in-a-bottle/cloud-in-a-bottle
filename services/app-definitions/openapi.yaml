openapi: 3.0.3
info:
  title: Cloud in a Bottle App Definitions Service
  version: 0.1.0
  description: |
    Service identifier: github.com/cloud-in-a-bottle/cloud-in-a-bottle/services/app-definitions

    Call POST /export through the normal authenticated V2 service proxy, using an app's
    declared shortname and app token. Requires an approved global {"mode":"sharing"}
    or {"mode":"private"} grant. Private also permits sharing; sharing never permits private.
    The owner-only equivalent is POST /api/app-definitions/export, authenticated by an
    owner session or API key. The owner adapter and builtin handler return application/json
    and Cache-Control: no-store, including their error responses. Before builtin dispatch,
    the service proxy's existing authentication, shortname and provider-resolution responses apply.

    This is a minimal definition summary, not an import format, backup, lockfile, or
    reproducibility guarantee. It excludes manifests, commands, images, environment values,
    arbitrary grants, descriptions, local paths, app data, runtime IDs/status, owner tokens,
    and platform settings. Remote source URLs omit userinfo, parameters, query and fragment;
    ref is the configured @ref, not an inferred deployed commit. Local sources cannot be
    reconstructed. A builtin identifier is the source directory name under the configured
    bundled apps directory, identified from stored metadata without filesystem inspection.

    Apps are sorted by name, published port mappings by label, and secret keys lexically.
    Only actual approved Secrets-service grants are included, not requested manifest grants.
    App-scoped grants apply only to the selected default Secrets provider. A secret_keys
    entry of "*" records an approved wildcard. Sharing never contacts Secrets. Private
    retrieves the union of approved keys from the selected provider, expanding a wildcard
    through /list then /get on that same captured target. It does not inspect a Secrets DB
    or scrape an unreferenced store. Private always includes secret_values and a sorted,
    unique missing_secret_keys list; sharing omits both. Empty values are preserved, and
    extra unrequested values are ignored. Every requested key must appear exactly once,
    either as a string value or in the provider's explicit missing list. Explicitly absent
    keys are reported successfully, including keys deleted between wildcard /list and /get.
    Duplicate, overlapping, non-string or unrequested missing entries and unaccounted keys
    fail the export, as do unusable providers/responses. No relevant keys means empty
    secret_values and missing_secret_keys without contacting Secrets. Metadata is a single
    database snapshot; secret values are read afterward and can change independently.
paths:
  /export:
    post:
      summary: Export minimal app definitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [sharing, private]
                  default: sharing
      responses:
        "200":
          description: Pretty-printed deterministic JSON. Private requires secret_values and missing_secret_keys, including explicitly absent keys. Sharing omits both fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          description: Invalid JSON object or mode (including null or a non-string mode).
        "403":
          description: permission_required with required_grant containing the global mode grant. The proxy adds grant_url.
        "502":
          description: Export failed because a compatible Secrets provider is unavailable or its response is invalid, including keys not accounted for by values or explicit missing entries.
components:
  schemas:
    Export:
      type: object
      additionalProperties: false
      required: [schema_version, mode, apps]
      oneOf:
        - properties:
            mode: {enum: [sharing]}
          not:
            anyOf:
              - required: [secret_values]
              - required: [missing_secret_keys]
        - properties:
            mode: {enum: [private]}
          required: [secret_values, missing_secret_keys]
      properties:
        schema_version:
          type: integer
          enum: [1]
        mode:
          type: string
          enum: [sharing, private]
        apps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, source, port_mappings, secret_keys]
            properties:
              name:
                type: string
              source:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [kind, repo_url, ref]
                    properties:
                      kind: {type: string, enum: [remote]}
                      repo_url: {type: string}
                      ref: {type: string, nullable: true}
                  - type: object
                    additionalProperties: false
                    required: [kind, identifier]
                    properties:
                      kind: {type: string, enum: [builtin]}
                      identifier: {type: string}
                  - type: object
                    additionalProperties: false
                    required: [kind]
                    properties:
                      kind: {type: string, enum: [local, unknown]}
              port_mappings:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [label, container_port, host_port]
                  properties:
                    label: {type: string}
                    container_port: {type: integer}
                    host_port: {type: integer}
              secret_keys:
                type: array
                items: {type: string}
        secret_values:
          type: object
          additionalProperties: {type: string}
        missing_secret_keys:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Sorted names of requested keys explicitly reported absent by Secrets. Empty when all requested keys have values.
