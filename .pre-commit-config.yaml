repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: "ruff auto-fix"
        entry: pixi run -e dev ruff check
        language: system
        types: [python]
        args:
          - "--fix"
          - "--force-exclude"  # respect pyproject.toml's exclude settings even when passing in explicit file list
      - id: ruff-format
        name: "ruff format"
        entry: pixi run -e dev ruff format
        language: system
        types: [python]
        args:
          - "--force-exclude"  # respect pyproject.toml's exclude settings even when passing in explicit file list
      - id: mypy
        name: mypy
        entry: pixi run -e dev mypy
        language: system
        pass_filenames: false
        types: [python]
      # The pin lives in pyproject.toml's `requires-pixi`, which makes a wrong local pixi fail here
      # rather than silently resolve a lock that CI/deploy's pinned pixi rejects under `--locked`.
      - id: pixi-lock
        name: "pixi lock (pinned)"
        entry: pixi lock
        language: system
        files: ^(pyproject\.toml|pixi\.lock)$
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
