repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: "ruff auto-fix"
        entry: pixi run -e dev ruff check
        language: system
        types: [python]
        args:
          - "--fix"
          - "--force-exclude"  # respect pyproject.toml's exclude settings even when passing in explicit file list
      - id: ruff-format
        name: "ruff format"
        entry: pixi run -e dev ruff format
        language: system
        types: [python]
        args:
          - "--force-exclude"  # respect pyproject.toml's exclude settings even when passing in explicit file list
      - id: mypy
        name: mypy
        entry: pixi run -e dev mypy
        language: system
        pass_filenames: false
        types: [python]
      # Pinned pixi so `pixi install/run --locked` (CI + deploy) stays reproducible; a different
      # local pixi resolves a lock CI's pinned pixi then rejects.
      - id: pixi-lock
        name: "pixi lock (pinned)"
        entry: pixi exec --spec pixi=0.70.2 -- pixi lock
        language: system
        files: ^(pyproject\.toml|pixi\.lock)$
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
