---
# Usage: ansible-playbook ansible/setup.yml -i <IP>, -e domain=<domain>
#
# The trailing comma after the IP is required (tells ansible it's a host list, not a file).
# Example: ansible-playbook ansible/setup.yml -i 65.21.1.2, -e domain=host.example.com
#
# Optional variables:
#   -e public_ip=1.2.3.4         (defaults to target IP)
#   -e initial_user=ubuntu        (defaults to root)
#   -e openhost_branch=<branch>   (git branch to deploy; defaults to main)
#   -e openhost_commit=<sha>      (exact commit to deploy; used if
#                                  openhost_branch is unset)
#   -e claim_token=<secret>       (gates /setup until the human supplies this
#                                  token; URL-safe: letters, digits, '-', '_'.
#                                  If omitted, the play generates a random
#                                  token and prints the claim URL. Hand the
#                                  URL to whoever will claim the instance.)

- name: Bootstrap host user
  hosts: all
  user: "{{ initial_user | default('root') }}"
  become: "{{ initial_user | default('root') != 'root' }}"
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - import_tasks: tasks/user_setup.yml

- name: Install system dependencies
  hosts: all
  user: host
  become: yes
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - import_tasks: tasks/apt_packages.yml
    - import_tasks: tasks/containers.yml
    - import_tasks: tasks/egress.yml
    - import_tasks: tasks/journald.yml

- name: Dev environment
  hosts: all
  user: host
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - import_tasks: tasks/dev_machine.yml

- name: Setup OpenHost
  hosts: all
  user: host
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - import_tasks: tasks/reclaim_pixi.yml
    - import_tasks: tasks/sync_code.yml
    - import_tasks: tasks/pixi.yml
    - import_tasks: tasks/coredns.yml
      when: not (local_http_only | default(false) | bool)
    - import_tasks: tasks/write_openhost_config.yml
    - import_tasks: tasks/install_openhost_units.yml
    - import_tasks: tasks/restart_openhost_service.yml
