---
# Domain-DEPENDENT last mile: render config.toml, write first_boot.toml (the
# domain + claim-token seed the router captures into the DB on first boot), and
# show the claim URL. Needs `domain` (and the cert_provider/cert_api_* vars the
# config template references). Imported by setup.yml (full run), local_setup.yml,
# and finalize.yml (warm-pool claim-time). Deliberately contains NOTHING that a
# domain-less prebake needs — the systemd unit install lives in
# tasks/install_openhost_units.yml.

- name: Create config directory
  file:
    path: /home/host/.openhost/local_compute_space
    state: directory
    owner: host
    group: host

- name: Stat existing compute_space config
  ansible.builtin.stat:
    path: /home/host/.openhost/local_compute_space/config.toml
  register: existing_config

# Render config.toml from the operator-supplied vars. On a re-deploy against an
# already-configured host we skip this and respect the config that's there, so
# you don't have to re-pass every -e var — or re-copy secrets like the cert_api
# client_secret — just to redeploy code. Pass -e overwrite_existing=true to
# re-render (needed to pick up a breaking change to the template; re-supply the
# vars when you do).
- name: Write compute_space config
  template:
    src: templates/config.toml.j2
    dest: /home/host/.openhost/local_compute_space/config.toml
    owner: host
    group: host
  when: (overwrite_existing | default(false) | bool) or not existing_config.stat.exists
  register: config_file

# First-boot seed: domain + claim token → first_boot.toml, consumed once by the router on first
# boot (domain → the DB `domains` table, token → the DB `settings` store), after which the DB is
# authoritative and this file is ignored. `claim_token_required` in config.toml defaults to true,
# so /setup rejects every caller unless their request carries a token matching the one seeded here.
# Pass `-e claim_token_required=false` (provision.sh: `--open-claim`) to leave /setup ungated on
# a loopback-only instance. The token is still seeded either way, so flipping the config back to
# true later re-gates /setup without a re-seed.
# If the operator doesn't pass `-e claim_token=…`, we generate a fresh URL-safe random one and print
# the claim URL at the end of the play — handing the secret to the human who will claim the
# workspace. vm-manager passes the var to control the value. setup_app clears the token from the DB
# after a successful claim, so on re-deploys (where the instance is already claimed) the rewritten
# — and here skipped — file is inert.
#
# On a re-deploy we leave an existing first_boot.toml alone (skip unless forced): it's consumed once,
# so re-writing it can't change an already-seeded domain, and a claim URL already handed out keeps
# working. Pass -e overwrite_existing=true to rotate the token on a still-unclaimed instance.
- name: Stat existing first_boot.toml
  ansible.builtin.stat:
    path: /home/host/.openhost/local_compute_space/first_boot.toml
  register: existing_first_boot

- name: Resolve effective claim token
  set_fact:
    effective_claim_token: "{{ claim_token | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}"
  when: (overwrite_existing | default(false) | bool) or not existing_first_boot.stat.exists

- name: Write first_boot.toml seed
  template:
    src: templates/first_boot.toml.j2
    dest: /home/host/.openhost/local_compute_space/first_boot.toml
    owner: host
    group: host
    mode: "0600"
  when: (overwrite_existing | default(false) | bool) or not existing_first_boot.stat.exists

- name: Show claim URL
  vars:
    # In HTTP-only mode the domain usually carries its own port (e.g. `lvh.me:8080`, which the
    # router needs to build absolute URLs); fall back to :8080 only when it doesn't.
    base_url: >-
      {{ ('http://' + domain + ('' if ':' in domain else ':8080'))
         if (local_http_only | default(false) | bool) else ('https://' + domain) }}
  debug:
    msg: >-
      {{ ('Setup URL (ungated): ' + base_url + '/setup')
         if not (claim_token_required | default(true) | bool)
         else ('Claim URL: ' + base_url + '/setup?claim=' + effective_claim_token) }}
  when: (overwrite_existing | default(false) | bool) or not existing_first_boot.stat.exists
