---
# Install base apt packages. Runs with become: yes.

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

# dist-upgrade takes 7-10 min on a fresh Ubuntu image and is the slowest
# step by far.  For ephemeral CI instances that are torn down after a single
# test run, it's unnecessary.  Pass -e skip_apt_upgrade=true to skip it.
- name: Upgrade all packages
  apt:
    upgrade: dist
  when: not (skip_apt_upgrade | default(false) | bool)

- name: Install base packages
  apt:
    name:
      - git
      - curl
      - wget
      - openssh-server
      - ca-certificates
      - gnupg
      # fuse3 ships fusermount3, which JuiceFS uses for the
      # archive-tier mount.  Already a transitive dep of plenty
      # of things on Ubuntu but pin it explicitly so the
      # archive backend can't fail-to-mount on a stripped image.
      - fuse3
    state: present

# LAN mode (a `.local` domain) splits the names in two: avahi publishes the bare domain, which is
# the machine's own <hostname>.local, and the router's responder publishes every app subdomain under
# it.  So the hostname must be the domain's label (`bottle` for bottle.local); it is set alongside
# the domain seed, in write_openhost_config.yml.  Leaving the bare name to avahi also keeps the box
# findable (`ssh host@bottle.local`) when openhost is down or mid-upgrade.
- name: LAN mode avahi
  when: (domain | default('')).split(':')[0].lower().endswith('.local')
  block:
    - name: Check the LAN mode domain is a single label under .local
      assert:
        that: domain.split(':')[0].split('.') | length == 2
        fail_msg: "LAN mode needs a domain like bottle.local (the machine's hostname plus .local), got {{ domain }}"

    - name: Install avahi
      apt:
        name: avahi-daemon
        state: present

# JuiceFS mounts the archive tier with -o allow_other so apps
# running under rootless-podman's subuid namespace can traverse
# it.  fusermount refuses allow_other unless this option is set
# in /etc/fuse.conf.  Idempotent.
- name: Enable user_allow_other in /etc/fuse.conf
  lineinfile:
    path: /etc/fuse.conf
    regexp: '^#?\s*user_allow_other\s*$'
    line: 'user_allow_other'
    state: present
    create: false
