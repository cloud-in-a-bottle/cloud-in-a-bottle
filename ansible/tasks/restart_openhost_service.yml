---
# Enable (boot persistence) and start the Cloud in a Bottle service. Both are gated by
# skip_service_start so a prebake / warm-pool bake leaves the service fully
# dormant — not started now, and not started on reboot either — since a
# domain-less host has no config.toml and no claim token and must not let anyone
# in. Finalize runs this with skip_service_start unset/false to bring it up.
- name: Enable Cloud in a Bottle service
  become: yes
  become_user: root
  systemd:
    name: openhost
    enabled: yes
  when: not (skip_service_start | default(false) | bool)

- name: Stop Cloud in a Bottle before applying migrations
  become: yes
  become_user: root
  systemd:
    name: openhost
    state: stopped
  when: not (skip_service_start | default(false) | bool)

- name: Apply pending system migrations
  become: yes
  become_user: root
  when: not (skip_service_start | default(false) | bool)
  block:
    - name: Run system migrations with a bounded execution time
      shell: |
        umask 077
        exec /usr/local/bin/openhost_system_agent update migrate > /var/log/openhost-system-migrations.log 2>&1
      environment:
        OPENHOST_ROUTER_CONFIG: /home/host/.openhost/local_compute_space/config.toml
      async: 600
      poll: 5
  rescue:
    - name: Read system migration output
      command: tail -n 200 /var/log/openhost-system-migrations.log
      register: system_migration_log
      changed_when: false
      failed_when: false

    - name: Report system migration failure
      fail:
        msg: |
          System migrations failed: {{ ansible_failed_result.msg | default('command failed') }}
          {{ system_migration_log.stdout | default('Migration log unavailable') }}

- name: Start Cloud in a Bottle service
  become: yes
  become_user: root
  systemd:
    name: openhost
    state: started
  when: not (skip_service_start | default(false) | bool)
