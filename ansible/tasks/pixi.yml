---
# Install pixi and caddy, and let caddy bind privileged ports.

- name: Create Pixi installer directory
  file:
    path: /home/host/.cache/openhost
    state: directory
    mode: "0755"

- name: Copy Pixi download helpers
  copy:
    src: "{{ playbook_dir }}/../scripts/{{ item }}"
    dest: "/home/host/.cache/openhost/{{ item }}"
    mode: "0755"
  loop:
    - install_pixi.sh
    - download_verified.sh

- name: Install pinned Pixi
  command: bash /home/host/.cache/openhost/install_pixi.sh v0.70.2
  args:
    creates: /home/host/.pixi/bin/pixi
  environment:
    PIXI_BIN_DIR: /home/host/.pixi/bin
    PIXI_CACHE_DIR: /home/host/.cache/openhost/pixi

- name: Add pixi to PATH in .bashrc
  lineinfile:
    path: /home/host/.bashrc
    line: 'export PATH="$HOME/.pixi/bin:$PATH"'
    create: yes

- name: Install pixi dependencies (caddy)
  shell: /home/host/.pixi/bin/pixi install
  args:
    chdir: /home/host/openhost

- name: Find caddy binary path
  shell: /home/host/.pixi/bin/pixi run which caddy
  args:
    chdir: /home/host/openhost
  register: caddy_path
  changed_when: false

- name: Set cap_net_bind_service on caddy
  become: yes
  become_user: root
  shell: setcap 'cap_net_bind_service=+ep' {{ caddy_path.stdout }}

- name: Create resolved.conf.d directory
  become: yes
  become_user: root
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory

- name: Disable systemd-resolved stub listener (frees port 53 for coredns)
  become: yes
  become_user: root
  copy:
    content: "[Resolve]\nDNSStubListener=no\n"
    dest: /etc/systemd/resolved.conf.d/no-stub.conf
  register: resolved_conf

- name: Restart systemd-resolved
  become: yes
  become_user: root
  systemd:
    name: systemd-resolved
    state: restarted
  when: resolved_conf.changed
